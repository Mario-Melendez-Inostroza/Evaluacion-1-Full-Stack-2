<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Knight of Ruin</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Encabezado y navegación -->
    <header>
        <nav>

            <div class="logo">
                Knight of Ruin
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="index.html#juego">El juego</a>
                </li>

                <li>
                    <a href="index.html#galeria">Galería</a>
                </li>

                <li>
                    <a href="login.html">Iniciar sesión</a>
                </li>

                <li>
                    <a href="register.html">Registrarse</a>
                </li>

            </ul>

        </nav>
    </header>


    <!-- Contenido principal -->
    <main>

        <section class="form-section">

            <div class="form-container">

                <h1>Iniciar sesión</h1>

                <p>
                    Ingresa a tu cuenta para continuar tu aventura.
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            minlength="6"
                            required
                        >

                    </div>


                    <p id="loginMessage" class="form-message"></p>


                    <button type="submit" class="button">
                        Iniciar sesión
                    </button>

                </form>


                <p class="form-link">

                    ¿No tienes una cuenta?

                    <a href="register.html">
                        Registrarse
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- Pie de página -->
    <footer>

        <p>
            &copy; 2026 Knight of Ruin - Proyecto Desarrollo Fullstack II
        </p>

    </footer>


    <script src="js/login.js"></script>

</body>

</html>
